# Single-origin reverse proxy for Agentic RAG SaaS:
#   /         -> Static marketing & Google sign-in landing page
#   /app      -> Personalized React Dashboard SPA (built with --base=/app/)
#   /api/*    -> FastAPI + LangGraph SSE backend (unbuffered streaming)

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow up to 25 MB user SQLite uploads (+ multipart overhead)
    client_max_body_size 30m;

    # Hardened security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ------------------------------------------------------------------
    # Unified FastAPI + SSE Streaming API (/api/*)
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Critical for SSE (/api/query/stream): disable proxy buffering
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering "no" always;

        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ------------------------------------------------------------------
    # Personalized React Dashboard SPA (/app and /app/*)
    # Serves /app?connected=<provider> directly without losing query params
    # ------------------------------------------------------------------
    location = /app {
        try_files /app/index.html =404;
    }

    location /app/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    # ------------------------------------------------------------------
    # Landing Page (/)
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
