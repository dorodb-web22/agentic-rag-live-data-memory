name: CI

on:
  push:
    branches: [main, feature/basic-agent-query]
  pull_request:
    branches: [main, feature/basic-agent-query]

jobs:
  backend-test:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Initialize demo SQLite database
        run: |
          python -m app.db_setup

      - name: Run pytest
        run: |
          pytest -v --durations=10

  frontend-test:
    name: Frontend Tests (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Run vitest
        run: npm test

      - name: Build frontend
        run: npm run build

  deepeval-gate:
    name: DeepEval Faithfulness Gate
    needs: [backend-test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,eval]"

      - name: Initialize demo SQLite database
        run: |
          python -m app.db_setup

      - name: Verify dataset & deterministic citation invariants
        run: |
          pytest tests/test_eval_dataset.py -v

      - name: Run DeepEval faithfulness merge gate (threshold >= 0.80)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPEVAL_JUDGE_MODEL: gpt-4o-mini
        run: |
          if [ -n "${OPENAI_API_KEY}" ]; then
            python -m evals.run_eval --threshold 0.8
          else
            echo "::notice::OPENAI_API_KEY secret is not set in this CI context; deterministic dataset & citation invariants passed. Configure secrets.OPENAI_API_KEY to enforce live LLM faithfulness judging."
          fi

      - name: Upload DeepEval results artifact
        if: always() && hashFiles('backend/evals/results.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: deepeval-faithfulness-results
          path: backend/evals/results.json
