services:
  postgres:
    # pgvector image: Alembic migration 002 runs `CREATE EXTENSION vector`, which the
    # plain postgres:16-alpine image does not ship.
    image: pgvector/pgvector:pg16
    container_name: g135-agentic-rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-agentic_rag}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-agentic_rag}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
